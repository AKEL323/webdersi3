<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <link rel="stylesheet" href="style/2221032048.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Etkinlik Güncelle</h1>

        <nav>
            <a href="index.html">Ana Sayfa</a> ·
            <a href="etkinlikler.html">Etkinlikler</a> ·
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>

        <form
            id="etkinlik-formu"
            data-mode="guncelle"
            novalidate
        >

            <p>
                <label for="ad">Etkinlik adı</label>

                <input
                    type="text"
                    id="ad"
                    name="ad"
                >

                <span
                    id="hata-ad"
                    class="hata-mesaji"
                ></span>
            </p>


            <p>
                <label for="kategori">Kategori</label>

                <select
                    id="kategori"
                    name="kategori"
                >
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Söyleşi">Söyleşi</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Konser">Konser</option>
                </select>

                <span
                    id="hata-kategori"
                    class="hata-mesaji"
                ></span>
            </p>


            <p>
                <label for="tarih">Tarih</label>

                <input
                    type="date"
                    id="tarih"
                    name="tarih"
                >

                <span
                    id="hata-tarih"
                    class="hata-mesaji"
                ></span>
            </p>


            <p>
                <label for="saat">Saat</label>

                <input
                    type="time"
                    id="saat"
                    name="saat"
                >

                <span
                    id="hata-saat"
                    class="hata-mesaji"
                ></span>
            </p>


            <p>
                <label for="yer">Yer</label>

                <input
                    type="text"
                    id="yer"
                    name="yer"
                >

                <span
                    id="hata-yer"
                    class="hata-mesaji"
                ></span>
            </p>


            <p>
                <label for="aciklama">Açıklama</label>

                <textarea
                    id="aciklama"
                    name="aciklama"
                    rows="4"
                ></textarea>

                <span
                    id="hata-aciklama"
                    class="hata-mesaji"
                ></span>
            </p>


            <p>
                <label for="kontenjan">Kontenjan</label>

                <input
                    type="number"
                    id="kontenjan"
                    name="kontenjan"
                >

                <span
                    id="hata-kontenjan"
                    class="hata-mesaji"
                ></span>
            </p>


            <p>
                <button type="submit">
                    Güncelle
                </button>
            </p>

        </form>

        <div id="form-mesaj"></div>

    </main>

</div>

<script type="module" src="js/event-form.js"></script>

</body>
</html>
